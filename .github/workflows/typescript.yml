name: typescript

on:
  push:
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
  pull_request:
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run type-check
      - run: bun run test
      - run: bun run build
