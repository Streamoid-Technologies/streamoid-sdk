name: sync-go-mirror

# Publishes go/ to the public mirror, Streamoid-Technologies/streamoid-sdk-go.
#
# Go has no registry. The module path is the repository URL and
# proxy.golang.org only caches what it can clone, so a module in a private repo
# cannot be consumed without GOPRIVATE plus git credentials on every laptop, CI
# runner and Docker build. The mirror exists solely to give the module a public
# URL; go/ here stays the source of truth.
#
# The sync copies content rather than replaying history, so the mirror's main
# only ever fast-forwards - no force-push, and anything already tagged stays
# reachable. README.md and .github/ are excluded: the mirror keeps its own
# read-only banner and CI.
# No `paths:` filter deliberately. A path filter applies to tag pushes too, so
# tagging a commit that does not itself touch go/ would silently skip the
# release. The job is idempotent and exits in seconds when there is no diff,
# which is a cheaper price than a release that quietly publishes nothing.
on:
  push:
    branches: [main]
    tags: ["go/v*"]
  workflow_dispatch: {}

concurrency:
  group: sync-go-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scoped to the mirror alone: this token can push a public repo, so it
      # should not also be able to touch anything else on the way past.
      - name: Mint app token for the mirror
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: streamoid-sdk-go

      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/streamoid-sdk-go
          path: .mirror
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Copy go/ into the mirror
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'README.md' \
            go/ .mirror/

      - name: Commit and push
        id: push
        working-directory: .mirror
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "mirror already matches go/ at ${GITHUB_SHA}; nothing to push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "sync: go/ from streamoid-sdk@${GITHUB_SHA}" \
            -m "Generated by sync-go-mirror.yml. Do not edit here."
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A `go/vX.Y.Z` tag on the source is the release signal. The mirror's tag
      # drops the prefix because the module sits at that repo's root, so what
      # `go get` resolves is a plain vX.Y.Z.
      - name: Mirror the release tag
        if: startsWith(github.ref, 'refs/tags/go/v')
        working-directory: .mirror
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#go/}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} already exists on the mirror. Go module versions are immutable once the proxy has fetched them - bump the version instead of retagging."
            exit 1
          fi
          git tag -a "${TAG}" -m "${TAG} — synced from streamoid-sdk ${GITHUB_REF_NAME}"
          git push origin "${TAG}"
          echo "### Published \`github.com/${GITHUB_REPOSITORY_OWNER}/streamoid-sdk-go@${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ steps.push.outputs.changed }}" = "true" ]; then
              echo "Synced \`go/\` to the mirror."
            elif [ "${{ steps.push.outputs.changed }}" = "false" ]; then
              echo "Mirror already up to date — nothing to sync."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
